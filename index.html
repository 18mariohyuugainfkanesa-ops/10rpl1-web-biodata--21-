<!DOCTYPE html>

  <title>Menu Utama - PPLG</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>TEST HALAMAN INDEX</h1>

      <a class="menu-button" href="hasil.html">

        <span>Hasil Biodata</span>
      </a>

      <a class="menu-button" href="tabel.html">
        <span class="icon">🔎</span>
        <span>Tabel</span>

         target="_blank">

        <span>Ke Web</span>
      </a>

    </nav>

  </main>

  <!-- Script diletakkan paling bawah -->
  <script src="script.js"></script>
